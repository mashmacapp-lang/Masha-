<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MashMac</title>
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">M<span>▶</span></div><div><b>MashMac</b><small>Cloud Media</small></div></div>
    <button id="logoutBtn" class="ghost hidden">Log out</button>
  </header>

  <main>
    <section id="authView" class="card auth">
      <h1 id="authTitle">Welcome to MashMac</h1>
      <p class="muted">Store and watch your videos in the cloud.</p>
      <input id="email" type="email" placeholder="Email address" autocomplete="email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="authBtn">Create account</button>
      <button id="switchBtn" class="linkbtn">Already have an account? Log in</button>
      <p id="authMsg" class="msg"></p>
    </section>

    <section id="appView" class="hidden">
      <div class="hero">
        <div><h1>Your MashMac</h1><p class="muted">Upload, store and watch your videos.</p></div>
        <label class="uploadBtn">+ Upload video<input id="fileInput" type="file" accept="video/*" hidden></label>
      </div>
      <div id="progressWrap" class="progress hidden"><div id="progressBar"></div></div>
      <p id="appMsg" class="msg"></p>
      <div id="gallery" class="grid"></div>
    </section>
  </main>
  <footer>MashMac • Built with Supabase</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
