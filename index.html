<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MashMac Diagnostic</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main>
<h1>MashMac</h1><p>Tiyeni tiwone chomwe chikulepheretsa app kugwira ntchito.</p>
<section><h2>1. Supabase setup</h2>
<input id="url" placeholder="Supabase Project URL">
<input id="key" placeholder="Supabase Publishable / anon key">
<button id="save">Save & Test</button></section>
<section><h2>2. Test result</h2><pre id="log">Ready...</pre></section>
<section id="auth" class="hide"><h2>3. Account test</h2>
<input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password">
<button id="signup">Create account</button><button id="login">Login</button><p id="authmsg"></p></section>
<section id="storage" class="hide"><h2>4. Storage test</h2>
<input id="file" type="file"><button id="upload">Upload test file</button><p id="storagemsg"></p></section>
</main><script src="app.js"></script></body></html>
